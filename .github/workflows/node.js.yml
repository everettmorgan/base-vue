name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      CI: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Enable Corepack (Yarn 4)
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
        cache-dependency-path: yarn.lock

    - name: Show tool versions
      run: |
        node --version
        yarn --version

    - name: Install dependencies
      run: yarn install --immutable

    - name: Lint
      run: yarn lint

    - name: Type check
      run: yarn typecheck

    - name: Test
      run: yarn test

    - name: Build
      run: yarn build
